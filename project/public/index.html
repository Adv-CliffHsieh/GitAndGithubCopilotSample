<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App — Copilot Workshop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>待辦事項</h1>
    <form id="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="新增待辦事項…" required />
      <button type="submit">新增</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="empty-hint" hidden>目前沒有待辦事項 🎉</p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
